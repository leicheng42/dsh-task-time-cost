name: Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag
        required: true
        type: choice
        options:
          - latest
          - beta
        default: latest
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    name: Publish to npm via trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; dist-tag over OIDC needs >= 11.21.0.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Refuse to republish an existing version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-task-time-cost@$version" version >/dev/null 2>&1; then
            echo "dsh-task-time-cost@$version is already published" >&2
            exit 1
          fi
      - run: npm pack --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: published-package
          path: artifacts/*.tgz
          if-no-files-found: error
      - name: Publish
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.dist_tag }}"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            tag=beta
          else
            tag=latest
          fi
          npm publish artifacts/*.tgz --tag "$tag" --access public --ignore-scripts
      - name: Record registry state
        # Registry propagation can lag; a slow view must not fail a successful publish.
        continue-on-error: true
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node -e "const {execSync}=require('node:child_process'); const p=require('./package.json'); process.stdout.write(execSync('npm view '+p.name+'@'+p.version+' version dist.tarball dist.integrity dist-tags --json',{stdio:['ignore','pipe','inherit']}))"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
