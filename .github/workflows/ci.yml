name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Build reviewed archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-package
          path: artifacts/*.tgz
  compatibility:
    name: ${{ matrix.os }} / DSH SDK ${{ matrix.sdk }} / Node ${{ matrix.node }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [0.2.2-rc.1, 0.2.2-rc.2, 0.2.2-rc.3]
        node: [24]
        include:
          - os: ubuntu-latest
            sdk: 0.2.2-rc.3
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin manager drives pnpm for profile package operations.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/download-artifact@v4
        with:
          name: prebuilt-package
          path: artifacts/prebuilt
      # Install only the official SDK under test, so this job never depends on
      # this plugin's own dev-dependency resolution.
      - name: Install DSH ${{ matrix.sdk }}
        shell: bash
        run: |
          mkdir -p artifacts/compat-env
          cd artifacts/compat-env
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.sdk }} react@19.2.0
      - name: Install, import and compose the same archive
        env:
          DSH_COMPAT_SDK_ROOT: artifacts/compat-env
        run: node scripts/compatibility-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.sdk }}-node${{ matrix.node }}
          path: |
            artifacts/compatibility-*.json
            artifacts/compat-smoke-*/*.log
