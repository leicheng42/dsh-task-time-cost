name: Bug report / 问题反馈
description: Reproduce a problem without sharing private data.
body:
  - type: input
    id: versions
    attributes:
      label: DSH / plugin versions and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics
      description: Remove prompts, session identities, credentials and private endpoints. Do not attach full exports.
